name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: |
          pip install mypy types-PyYAML
          mypy src --ignore-missing-imports

      - name: Test (pytest)
        run: pytest -q

      - name: Security scan (bandit)
        run: |
          pip install bandit
          bandit -r src -ll

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          # --skip-editable: hexswarm itself is installed in editable mode and isn't on
          # PyPI, so trying to audit it as a "dependency" always fails. --strict would
          # treat that intentional skip as a collection failure too, so it's dropped;
          # pip-audit already exits non-zero on its own if a real vulnerability is found.
          pip-audit --skip-editable
