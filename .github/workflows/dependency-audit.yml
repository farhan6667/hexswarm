name: Nightly dependency audit

# Catches a dependency going bad between releases: a new advisory landing against a
# version we currently resolve to, including one already installed. CI's own pip-audit
# step only runs against whatever a push/PR actually installs; this runs on a schedule
# so it also fires on a day nobody pushed anything.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          # Same three documented, currently-unresolvable ignores as ci.yml (a litellm
          # 1.106.2 ceiling vs. the filelock CVE fix both apply to filelock, with no
          # version satisfying both) — kept here too so this job alerts on anything NEW,
          # not on the same known gap every single night. See SECURITY.md "Known limits".
          pip-audit --skip-editable \
            --ignore-vuln CVE-2026-112907 \
            --ignore-vuln CVE-2026-112913 \
            --ignore-vuln CVE-2026-112940
