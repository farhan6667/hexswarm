name: Nightly dependency audit

# Catches a dependency going bad between releases: a new advisory landing against a
# version we currently resolve to, including one already installed. CI's own pip-audit
# step only runs against whatever a push/PR actually installs; this runs on a schedule
# so it also fires on a day nobody pushed anything.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable
