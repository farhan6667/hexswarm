<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="HexSwarm: a scope-gated swarm of AI agents for authorized penetration testing and CTF challenges.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05120e"/><stop offset="1" stop-color="#0a1f1a"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f6f54"/><stop offset="1" stop-color="#5fd9a4"/></linearGradient>
<linearGradient id="acx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f6f54"/><stop offset="1" stop-color="#5fd9a4"/></linearGradient>
<radialGradient id="gl1" cx="0.78" cy="0.35" r="0.55"><stop offset="0" stop-color="#5fd9a4" stop-opacity="0.26"/><stop offset="1" stop-color="#5fd9a4" stop-opacity="0"/></radialGradient>
<radialGradient id="gl2" cx="0.1" cy="1" r="0.6"><stop offset="0" stop-color="#1f6f54" stop-opacity="0.22"/><stop offset="1" stop-color="#1f6f54" stop-opacity="0"/></radialGradient>
<pattern id="hex" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(0.9)">
<path d="M28 0 L56 16 V48 L28 64 L0 48 V16 Z M28 64 V97 M0 48 L-28 64 M56 48 L84 64" fill="none" stroke="#5fd9a4" stroke-opacity="0.09" stroke-width="1.2"/></pattern>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/></filter>
<clipPath id="wclip"><rect width="1280" height="400"/></clipPath>
</defs>
<g clip-path="url(#wclip)">
<rect width="1280" height="400" fill="url(#bg)"/>
<rect width="1280" height="400" fill="url(#hex)"/>
<rect width="1280" height="400" fill="url(#gl1)"/>
<rect width="1280" height="400" fill="url(#gl2)"/>
<rect x="0" y="0" width="8" height="400" fill="url(#acx)"/>

<!-- swarm glyph: six small hexes around a center node -->
<g transform="translate(96 72) scale(0.46)" opacity="0.9">
<g fill="none" stroke="url(#ac)" stroke-width="5">
<path d="M50 4 L92 20 V58 C92 88 72 108 50 116 C28 108 8 88 8 58 V20 Z" fill-opacity="0.12"/>
</g>
<g stroke="#5fd9a4" stroke-width="3" opacity="0.8">
<circle cx="50" cy="60" r="7" fill="#5fd9a4"/>
<circle cx="18" cy="30" r="5" fill="#1f6f54"/>
<circle cx="82" cy="30" r="5" fill="#1f6f54"/>
<circle cx="18" cy="90" r="5" fill="#1f6f54"/>
<circle cx="82" cy="90" r="5" fill="#1f6f54"/>
<line x1="50" y1="60" x2="18" y2="30"/>
<line x1="50" y1="60" x2="82" y2="30"/>
<line x1="50" y1="60" x2="18" y2="90"/>
<line x1="50" y1="60" x2="82" y2="90"/>
</g>
</g>

<text x="122" y="86" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5fd9a4" letter-spacing="3.2">AI AGENT SWARM · OFFENSIVE SECURITY</text>
<text x="70" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-2">HexSwarm</text>
<rect x="72" y="242" width="120" height="5" rx="2.5" fill="url(#acx)"/>
<text x="72" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#d3f5e8">Recon to report, one scope file away</text>
<text x="72" y="320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#d3f5e8">from a goal in plain English.</text>

<rect x="72" y="346" width="118" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#5fd9a4" stroke-opacity="0.6"/>
<text x="87" y="370" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="600" fill="#e6fff4">Scope-gated</text>
<rect x="200" y="346" width="148" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#5fd9a4" stroke-opacity="0.6"/>
<text x="215" y="370" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="600" fill="#e6fff4">Any LLM provider</text>
<rect x="358" y="346" width="98" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#5fd9a4" stroke-opacity="0.6"/>
<text x="373" y="370" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="600" fill="#e6fff4">CTF mode</text>

<g filter="url(#sh)">
<rect x="690" y="40" width="540" height="320" rx="16" fill="#061411" stroke="#5fd9a4" stroke-opacity="0.45"/>
</g>
<path d="M690 80 V56 a16 16 0 0 1 16 -16 H1214 a16 16 0 0 1 16 16 V80 Z" fill="#ffffff" fill-opacity="0.05"/>
<circle cx="714" cy="60" r="6" fill="#ff5f57"/>
<circle cx="734" cy="60" r="6" fill="#febc2e"/>
<circle cx="754" cy="60" r="6" fill="#28c840"/>
<text x="960" y="65" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#7db8a6" text-anchor="middle">hexswarm run</text>

<text x="714" y="114" font-family="'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="13" font-weight="600" fill="#ffffff"><tspan fill="#5fd9a4" font-weight="700">$ </tspan>hexswarm run --target scanme.nmap.org</text>
<text x="714" y="138" font-family="'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="13" font-weight="400" fill="#c9f5e5">--scope scope.yaml</text>

<text x="714" y="170" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#9fdcc0">RECON</text>
<rect x="714" y="178" width="492" height="22" rx="7" fill="#ffffff" fill-opacity="0.08"/>
<rect x="714" y="178" width="492" height="22" rx="7" fill="url(#acx)"/>
<text x="1206" y="194" font-family="'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="12" font-weight="700" fill="#06140f" text-anchor="end">done</text>

<text x="714" y="228" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#9fdcc0">SCAN</text>
<rect x="714" y="236" width="492" height="22" rx="7" fill="#ffffff" fill-opacity="0.08"/>
<rect x="714" y="236" width="492" height="22" rx="7" fill="url(#acx)"/>
<text x="1206" y="252" font-family="'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="12" font-weight="700" fill="#06140f" text-anchor="end">done</text>

<text x="714" y="286" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#9fdcc0">EXPLOIT</text>
<rect x="714" y="294" width="492" height="22" rx="7" fill="#ffffff" fill-opacity="0.08"/>
<rect x="714" y="294" width="221" height="22" rx="7" fill="url(#acx)"/>
<text x="1206" y="310" font-family="'Cascadia Mono', 'Consolas', 'Courier New', monospace" font-size="12" font-weight="700" fill="#e6fff4" text-anchor="end">working...</text>

<text x="714" y="344" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#5fd9a4">scope guard: authorized, intrusive cap</text>
</g>
</svg>
