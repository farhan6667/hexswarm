[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexswarm"
version = "1.1.0"
description = "A swarm-of-agents framework for AI-driven offensive security research, pentesting labs, and CTF solving."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Syed Farhan Ahmed" }
]
keywords = [
    "cybersecurity", "ai-agents", "penetration-testing", "ctf",
    "llm", "red-team", "security-automation", "ollama", "anthropic", "openai"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Upper-bounded after the 2026-10-21 LiteLLM supply-chain compromise: PyPI and the
    # Docker images briefly served a malicious 1.107.0 (a credential stealer plus a second-
    # stage RAT, see SECURITY.md). 1.106.2 is the confirmed-clean version named in the
    # vendor's own advisory. Re-open the upper bound only once a later release has been
    # independently verified clean, not just because PyPI shows it as latest.
    "litellm>=1.106.2,<1.107",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # Pinned below 2.x: v2 renamed FastMCP to MCPServer and reworked the low-level API.
    # v1's FastMCP is what HexSwarm's dynamic per-tool schema generation is built against.
    "mcp>=1.2.0,<2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    # Not a direct hexswarm dependency, but CI's hosted runner images preinstall an older
    # setuptools that pip-audit correctly flags (PYSEC-2026-3447, fixed in 83.0.0). Pinning
    # it here forces the patched version into the same environment pip-audit scans.
    "setuptools>=83.0.0",
]

[project.urls]
Homepage = "https://github.com/farhan6667/hexswarm"
Repository = "https://github.com/farhan6667/hexswarm"
Issues = "https://github.com/farhan6667/hexswarm/issues"
Sponsor = "https://github.com/farhan6667/farhan6667/blob/main/SPONSOR.md"

[project.scripts]
hexswarm = "hexswarm.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hexswarm"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# B008: typer/click options are *designed* to be called in argument defaults; this is
# the documented, correct pattern for that framework, not a real mutable-default bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
