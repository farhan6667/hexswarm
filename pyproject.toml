[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexswarm"
version = "0.1.0"
description = "A swarm-of-agents framework for AI-driven offensive security research, pentesting labs, and CTF solving."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Syed Farhan Ahmed" }
]
keywords = [
    "cybersecurity", "ai-agents", "penetration-testing", "ctf",
    "llm", "red-team", "security-automation", "ollama", "anthropic", "openai"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "litellm>=1.50.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/farhan6667/hexswarm"
Repository = "https://github.com/farhan6667/hexswarm"
Issues = "https://github.com/farhan6667/hexswarm/issues"
Sponsor = "https://github.com/farhan6667/farhan6667/blob/main/SPONSOR.md"

[project.scripts]
hexswarm = "hexswarm.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hexswarm"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# B008: typer/click options are *designed* to be called in argument defaults; this is
# the documented, correct pattern for that framework, not a real mutable-default bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
